<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Email-Phone</title>
  </head>
  <body>
    <div class="container">
      <form class="form">
        <div>
          <label for="email">Enter your Email:</label>
          <input
            type="email"
            id="email"
            placeholder="Your Email - (Required)"
          />
          <p class="email-error"></p>
        </div>
        <div>
          <label for="number-list">Enter your number(s):</label>
          <input
            type="text"
            id="number-list"
            placeholder="separated by commas , - (Optional)"
          />
          <p class="number-list__error"></p>
        </div>
        <label for="number">Generate number:</label>
        <div>
          <select id="number">
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="7">7</option>
            <option value="9">9</option>
            <option value="11">11</option>
          </select>
        </div>
        <button type="submit" class="form-button">Submit</button>
      </form>
      <main class="main">
        <div class="main-number">
          <h2 class="number"></h2>
          <ul class="numbers-list">
          </ul>
        </div>
        <div class="main-email">
          <h2 class="email"></h2>
          <div class="email-details">
            <p class="email-username"></p>
            <p class="email-domain"></p>
            <p class="email-provider"></p>
            <p class="email-extension"></p>
          </div>
        </div>
      </main>
    </div>
    <script src="./js/app.js"></script>
  </body>
</html>
